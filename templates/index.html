<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accessible Voice App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 600px;
    }

    .camera-box {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    #camera {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      border: 3px solid #00bcd4;
    }

    #question {
      font-size: 1.8rem;
      margin-bottom: 30px;
      padding: 10px;
      border-radius: 12px;
      background-color: #2d2d2d;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .big-button {
      font-size: 2rem;
      padding: 30px;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .big-button:hover {
      transform: scale(1.05);
    }

    /* Color-coded buttons */
    .green {
      background-color: #4CAF50;
    }

    .red {
      background-color: #f44336;
    }

    .yellow {
      background-color: #fbc02d;
      color: black;
    }

    .orange {
      background-color: #ff9800;
    }

    .mic-button {
      font-size: 1.5rem;
      padding: 10px 15px;
      background-color: #00bcd4;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .mic-button:hover {
      background-color: #008ba3;
    }

    .big-button {
  width: 180px;
  height: 80px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  border: none;
  border-radius: 20px;
  margin: 15px;
  transition: all 0.3s ease;
  box-shadow: 0 0 5px rgba(0,0,0,0.3);
  outline: none;
}

.big-button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}

/* DARKER solid colors */
.green {
  background-color: #0a7f27;
}
.green:hover {
  background-color: #07581b;
}

.red {
  background-color: #b30000;
}
.red:hover {
  background-color: #800000;
}

.yellow {
  background-color: #e6a200;
}
.yellow:hover {
  background-color: #b57f00;
}

.orange {
  background-color: #e65c00;
}
.orange:hover {
  background-color: #993d00;
}

/* Glow when selected via blink */
.big-button.selected {
  box-shadow: 0 0 20px 4px #ffffff;
  transform: scale(1.1);
}

  </style>
</head>
<body>
  <div class="container">
    <!-- Webcam feed -->
    <div class="camera-box">
      <img src="{{ url_for('video_feed') }}" id="camera" alt="Webcam Feed">
    </div>

    <!-- Question display -->
    <h1 id="question">Hi, ask your question...</h1>

    <!-- Buttons for selection -->
   <div id="questionDisplay" style="text-align: center; font-size: 20px; margin: 10px;"></div>

<div class="button-grid">
  <button id="btn1" class="big-button green"></button>
<button id="btn2" class="big-button red"></button>
<button id="btn3" class="big-button yellow"></button>
<button id="btn4" class="big-button orange"></button>

</div>


    <!-- Mic button -->
    <button id="mic-btn" class="mic-button">🎤</button>
  </div>

  <!-- Link your script -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
